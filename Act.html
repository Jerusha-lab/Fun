<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Pick an Activity 🎯</title>

    <style>

        body {
            background-color: #f2edff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            overflow-x: hidden;
        }

        .container {
            background-color: white;
            width: 450px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #8264c7;
            font-size: 35px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .activities {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .activity {
            background-color: #eee8ff;
            border: 2px solid #d8ccff;
            padding: 18px;
            border-radius: 15px;
            font-size: 17px;
            cursor: pointer;
        }

        .activity:hover {
            background-color: #ddd2ff;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #8264c7;
        }

        .confetti {
            position: fixed;
            top: -30px;
            font-size: 20px;
            pointer-events: none;
            animation: fall 3s linear forwards;
            z-index: 999;
        }

        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            25% {
                transform: translateY(25vh) translateX(30px) rotate(90deg);
            }

            50% {
                transform: translateY(50vh) translateX(-30px) rotate(180deg);
            }

            75% {
                transform: translateY(75vh) translateX(30px) rotate(270deg);
            }

            100% {
                transform: translateY(100vh) translateX(-20px) rotate(360deg);
                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>🎯 What Are We Doing?</h1>

        <p>
            Pick your weapon of choice 😂
        </p>


        <div class="activities">

            <button class="activity" onclick="chooseActivity('Movie Night 🎬')">
                🎬 Movie Night
            </button>

            <button class="activity" onclick="chooseActivity('Food Hunt 🍕')">
                🍕 Food Hunt
            </button>

            <button class="activity" onclick="chooseActivity('Shopping 🛍️')">
                🛍️ Shopping
            </button>

            <button class="activity" onclick="chooseActivity('Bowling 🎳')">
                🎳 Bowling
            </button>

            <button class="activity" onclick="chooseActivity('Cafe Hopping ☕')">
                ☕ Cafe Hopping
            </button>

            <button class="activity" onclick="chooseActivity('Just Chill 🛋️')">
                🛋️ Just Chill
            </button>

        </div>


        <div id="result"></div>

    </div>



    <script>

        function chooseActivity(activity) {

            document.getElementById("result").innerHTML =
                "LET'S DO " + activity + "! 🥳💗";

            heartConfetti();

        }


        function heartConfetti() {

            var colors = [
                "#ff69a4",
                "#ff1493",
                "#ffb6c1",
                "#ffd166",
                "#8264c7",
                "#8ecae6"
            ];


            for (var i = 0; i < 100; i++) {

                var heart = document.createElement("div");

                heart.classList.add("confetti");

                heart.innerHTML = "♥";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.color =
                    colors[Math.floor(Math.random() * colors.length)];

                heart.style.fontSize =
                    (15 + Math.random() * 25) + "px";

                heart.style.animationDelay =
                    Math.random() * 1.5 + "s";

                document.body.appendChild(heart);

                setTimeout(function() {
                    heart.remove();
                }, 4500);

            }

        }

    </script>


</body>

</html>
