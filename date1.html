<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Pick a Date 🗓️</title>

    <style>

        body {
            background-color: #fff4df;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            overflow-x: hidden;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #e58b35;
            font-size: 35px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ffc477;
            border-radius: 10px;
            margin: 20px;
        }

        button {
            background-color: #f5a742;
            color: white;
            border: none;
            padding: 13px 25px;
            font-size: 17px;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e8912f;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #e58b35;
        }

        .confetti {
            position: fixed;
            top: -30px;
            font-size: 20px;
            pointer-events: none;
            animation: fall 3s linear forwards;
            z-index: 999;
        }

        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            25% {
                transform: translateY(25vh) translateX(30px) rotate(90deg);
            }

            50% {
                transform: translateY(50vh) translateX(-30px) rotate(180deg);
            }

            75% {
                transform: translateY(75vh) translateX(30px) rotate(270deg);
            }

            100% {
                transform: translateY(100vh) translateX(-20px) rotate(360deg);
                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>📅 Pick a Date!</h1>

        <p>
            When are we causing problems together? 😂
        </p>


        <input type="date" id="date">


        <br>


        <button onclick="confirmDate()">
            Confirm Date 🎉
        </button>


        <div id="result"></div>

    </div>



    <script>

        function confirmDate() {

            var date = document.getElementById("date").value;


            if (date == "") {

                document.getElementById("result").innerHTML =
                    "Choose a date first, genius 😭";

                return;

            }


            var selectedDate = new Date(date);


            var formattedDate = selectedDate.toLocaleDateString(
                "en-US",
                {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );


            document.getElementById("result").innerHTML =
                "IT'S A DATE!! 🥳<br>" +
                formattedDate +
                " 💗";


            heartConfetti();

        }


        function heartConfetti() {

            var colors = [
                "#ff69a4",
                "#ff1493",
                "#ffb6c1",
                "#ffd166",
                "#e58b35",
                "#8ecae6"
            ];


            for (var i = 0; i < 100; i++) {

                var heart = document.createElement("div");

                heart.classList.add("confetti");

                heart.innerHTML = "♥";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.color =
                    colors[Math.floor(Math.random() * colors.length)];

                heart.style.fontSize =
                    (15 + Math.random() * 25) + "px";

                heart.style.animationDelay =
                    Math.random() * 1.5 + "s";

                document.body.appendChild(heart);

                setTimeout(function() {
                    heart.remove();
                }, 4500);

            }

        }

    </script>
    <style>
         .activities{
            color: #880505;
            font-weight: bold;
            font-size:large;
        }
    </style>
<br><br><br>
<a href="Act.html" id = "activities" class="activities">Pick an Activity!</a>


</body>

</html>
