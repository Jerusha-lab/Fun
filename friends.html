<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Friend Hangout 💗</title>

    <style>

        body {
            background-image: url('Images/playful.png');
            background-size: cover; 
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            overflow: hidden;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #4b8ed8;
            font-size: 35px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 14px 25px;
            font-size: 17px;
            border-radius: 15px;
            cursor: pointer;
        }

        .yes {
            background-color: #72d6a3;
            color: white;
        }

        .no {
            background-color: #ff9b9b;
            color: white;
        }

        .yes:hover {
            background-color: #55c98d;
        }

        .no:hover {
            background-color: #ff7777;
        }

        #message {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #4b8ed8;
        }

        .confetti {
            position: fixed;
            top: -30px;
            font-size: 20px;
            pointer-events: none;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            25% {
                transform: translateY(25vh) translateX(30px) rotate(90deg);
            }

            50% {
                transform: translateY(50vh) translateX(-30px) rotate(180deg);
            }

            75% {
                transform: translateY(75vh) translateX(30px) rotate(270deg);
            }

            100% {
                transform: translateY(100vh) translateX(-20px) rotate(360deg);
                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>Wanna Hang Out? 🫶</h1>

        <p>
            Because clearly we haven't seen each other enough 😂
        </p>

        <p>
            Sooo... are you free for a little adventure?
        </p>


        <div class="buttons">

            <button class="yes" onclick="yesClicked()">
                YESSS 🥳
            </button>

            <button class="no" onclick="noClicked()">
                Nope 😭
            </button>

        </div>


        <div id="message"></div>

    </div>



    <script>

        function yesClicked() {

            document.getElementById("message").innerHTML =
                "LESSGOOOO 😭🫶🎉";

            heartConfetti();

        }


        function noClicked() {

            document.getElementById("message").innerHTML =
                "Wow. Betrayal. 😭💔 Try again.";

        }


        function heartConfetti() {

            var colors = [
                "#ff69a4",
                "#ff1493",
                "#ffb6c1",
                "#ffd166",
                "#72d6a3",
                "#8ecae6"
            ];


            for (var i = 0; i < 100; i++) {

                var heart = document.createElement("div");

                heart.classList.add("confetti");

                heart.innerHTML = "♥";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.color =
                    colors[Math.floor(Math.random() * colors.length)];

                heart.style.fontSize =
                    (15 + Math.random() * 25) + "px";

                heart.style.animationDelay =
                    Math.random() * 1.5 + "s";

                document.body.appendChild(heart);

                setTimeout(function() {
                    heart.remove();
                }, 4500);

            }

        }

    </script>
    <style>
         .datelink{
            color: #4b8ed8;
            font-weight: bold;
            font-size:large;
        }
    </style>
<br><br><br>
<a href="date1.html" id = "date-link" class="datelink">Pick a Date!</a>

</body>

</html>
